name: Shared validation

# Runs on pull requests that change shared/ or this workflow.
#
# Current scope: repository-structure check only. Shared artifacts are under
# refinement and schemas are not yet defined. Add schema and data validation
# when the formats are agreed, and record the decision in shared/docs/decisions/.

on:
  pull_request:
    paths:
      - "shared/**"
      - ".github/workflows/shared-validation.yml"

permissions:
  contents: read

jobs:
  structure:
    name: Shared structure check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the shared directories exist
        run: |
          missing=0
          for dir in shared/architecture/{bbw,ota-adas} shared/reference-tara/{bbw,ota-adas} shared/benchmarks/{bbw,ota-adas} shared/schemas shared/docs/decisions; do
            if [ -d "$dir" ]; then
              echo "Found: $dir"
            else
              echo "::error::Missing directory: $dir"
              missing=1
            fi
          done
          exit "$missing"

      - name: Report validation scope
        run: |
          echo "This check verifies the shared directory structure only."
          echo "It does not validate schemas or reference data."
