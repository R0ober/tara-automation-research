[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tara-verification"
version = "0.1.0"
description = "Defect injection and verification of TARA documents."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tara_verification.contract" = ["*.schema.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
